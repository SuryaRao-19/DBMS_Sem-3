{% extends "base.html" %}
{% block title %}Set New Password — EZ Charge Network Portal{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="EZ Charge Network Portal" width="44" height="44" style="border-radius: 10px; margin: 0 auto 0.75rem;">
      <h2 style="margin-bottom: 0.3rem;">Create New Password</h2>
      <p class="page-subtitle" style="margin: 0;">Updating password for <strong>{{ email }}</strong></p>
    </div>

    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" data-loading-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label" for="password">New Password</label>
        <div class="password-input-wrap">
          <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" placeholder="Minimum 6 characters" minlength="6" required autofocus>
          <button type="button" class="password-eye-btn" onclick="togglePasswordVisibility('password', this)" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <div class="password-input-wrap">
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" autocomplete="new-password" placeholder="Repeat password" minlength="6" required>
          <button type="button" class="password-eye-btn" onclick="togglePasswordVisibility('confirm_password', this)" aria-label="Show confirm password" aria-pressed="false">Show</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" data-loading-label="Updating password..." style="margin-top: 1.25rem;">
        Save New Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
